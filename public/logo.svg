<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Light Theme Soft Glow & Shadows -->
    <filter id="cr_shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.06" />
    </filter>

    <filter id="cr_icon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Gradients -->
    <!-- Card Rim / Border Gradient -->
    <linearGradient id="cr_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.35" />
    </linearGradient>

    <!-- Card Background (Crisp Light Luxury Surface) -->
    <linearGradient id="cr_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Saffron Flame Ribbon (Strategy & Awakening) -->
    <linearGradient id="cr_saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Royal Navy / Indigo Pillar (Data & Command Intelligence) -->
    <linearGradient id="cr_navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Victory Emerald Swoosh (Electoral Triumph) -->
    <linearGradient id="cr_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Gold Accent Dot -->
    <linearGradient id="cr_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Base Minimalist Rounded Squircle Container -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#cr_card_bg)" filter="url(#cr_shadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" stroke="url(#cr_border)" stroke-width="3" fill="none" />

  <!-- Strategic Radial Watermark Arc (Democratic Mandate) -->
  <circle cx="256" cy="256" r="148" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 8" fill="none" opacity="0.6" />
  <circle cx="256" cy="256" r="172" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4 6" fill="none" opacity="0.8" />

  <!-- MAIN EMBLEM: Minimalist Interlocking Ballot Victory Ribbon forming 'C' & 'R' -->
  <g filter="url(#cr_icon_glow)">
    
    <!-- Left Geometric Saffron Arc (Represents 'C' of Chunav & Campaign Strategy) -->
    <path d="M 230 148 
             C 170 148 132 192 132 256 
             C 132 320 170 364 230 364
             C 252 364 274 356 290 342
             L 268 314
             C 256 324 244 330 230 330
             C 192 330 168 298 168 256
             C 168 214 192 182 230 182
             C 246 182 260 188 272 200
             L 294 172
             C 276 156 254 148 230 148 Z" 
          fill="url(#cr_saffron)" />

    <!-- Royal Navy Strategic Pillar (Central Column of Integrity / Ballot Box) -->
    <rect x="242" y="200" width="32" height="136" rx="16" fill="url(#cr_navy)" />

    <!-- Victory Checkmark & Diagonal Thrust (Represents 'R' of Ranniti & Electoral Mandate) -->
    <path d="M 226 264
             L 282 320
             C 288 326 298 326 304 320
             L 396 172
             C 402 162 396 150 384 150
             L 348 150
             C 340 150 334 154 330 162
             L 274 256
             L 252 234
             C 246 228 236 228 230 234
             L 226 238
             C 220 244 220 258 226 264 Z" 
          fill="url(#cr_emerald)" />

    <!-- Apex Saffron Chevron Accent (Forward Momentum) -->
    <polygon points="348,150 384,150 354,196 324,196" fill="url(#cr_saffron)" opacity="0.9" />

    <!-- Sovereign Gold Focal Beacon (Winning Majority Target) -->
    <circle cx="366" cy="136" r="14" fill="url(#cr_gold)" />
    <circle cx="366" cy="136" r="6" fill="#FFFFFF" />
  </g>
</svg>
